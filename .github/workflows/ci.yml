name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Create web/dist placeholder (go:embed needs it)
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>placeholder</title>' > web/dist/index.html

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        working-directory: web
        run: npm install

      - name: npm run build
        working-directory: web
        run: npm run build

  smoke:
    name: Smoke test (login + auth)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: web
        run: npm install && npm run build

      - name: Build binary
        run: go build -o dnsdist-panel ./cmd/server/

      - name: Run + verify
        run: |
          PANEL_DB=/tmp/panel.db PANEL_ADDR=127.0.0.1:18084 ./dnsdist-panel &
          sleep 2
          TOKEN=$(curl -sf -X POST http://127.0.0.1:18084/api/login \
            -H 'Content-Type: application/json' \
            -d '{"user":"admin","pass":"trust-ng-admin"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$TOKEN" ] || { echo "login failed"; exit 1; }
          curl -sf http://127.0.0.1:18084/api/dashboard -H "Authorization: Bearer $TOKEN" > /dev/null || { echo "dashboard failed"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18084/api/dashboard)
          [ "$CODE" = "401" ] || { echo "unauth check failed: $CODE"; exit 1; }
          curl -sf http://127.0.0.1:18084/ | grep -q "DNSDist Panel" || { echo "SPA root failed"; exit 1; }
          echo "SMOKE PASS"
